name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL 16 with pg_stat_statements
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16 \
            -c shared_preload_libraries=pg_stat_statements -c max_connections=200
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          sleep 2
          psql "postgres://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f scripts/setup-db.sql
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Tests, including one real fault-injection scenario
        run: go test -race -timeout 10m ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src test
      - run: npx vitest run
      - run: npx vite build
